name: gaming_platform
description: A comprehensive multi-game skill gaming platform for iOS and Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2
  equatable: ^2.0.5

  # Navigation
  go_router: ^12.0.0

  # Network
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  socket_io_client: ^2.0.3
  connectivity_plus: ^5.0.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  animated_text_kit: ^4.2.2
  confetti: ^0.7.0
  pin_code_fields: ^8.0.1
  flutter_spinkit: ^5.2.0

  # Firebase
  firebase_core: ^2.21.0
  firebase_messaging: ^14.7.6
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.6
  firebase_auth: ^4.14.1

  # Authentication
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^5.0.0
  otp_text_field: ^1.1.3

  # Payment
  razorpay_flutter: ^1.3.6
  upi_india: ^3.0.0

  # Media
  image_picker: ^1.0.4
  image_cropper: ^5.0.0
  video_player: ^2.8.1
  flutter_launcher_icons: ^0.13.1

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.1
  share_plus: ^7.2.1
  permission_handler: ^11.0.1
  package_info_plus: ^5.0.1
  device_info_plus: ^9.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.1

  # QR Code (for 2FA)
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Biometric
  local_auth: ^2.1.7

  # Charts & Graphs
  fl_chart: ^0.65.0

  # Animations
  rive: ^0.12.4

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

  # WebView (for payment gateways)
  webview_flutter: ^4.4.2

  # PDF (for receipts/reports)
  pdf: ^3.10.7
  printing: ^5.11.1

  # Smooth Page Indicator
  smooth_page_indicator: ^1.1.0

  # Badges
  badges: ^3.1.2

  # Country Code Picker
  country_code_picker: ^3.0.0

  # Dotted Border
  dotted_border: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  retrofit_generator: ^8.0.0
  mockito: ^5.4.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FF6B35"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
