name: CD - Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true

env:
  PYTHON_VERSION: '3.11'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    name: Build and Push Production Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=production-latest
          type=raw,value=${{ steps.version.outputs.version }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.prod
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://yourdomain.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

    - name: Create backup
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd ~/gaming-platform

          # Backup database
          docker-compose -f docker-compose.prod.yml exec -T postgres \
            pg_dump -U $POSTGRES_USER $POSTGRES_DB | \
            gzip > ./backups/backup_$(date +%Y%m%d_%H%M%S).sql.gz

          # Keep only last 7 days of backups
          find ./backups -name "backup_*.sql.gz" -mtime +7 -delete

          echo "✅ Backup created successfully"
        EOF

    - name: Copy deployment files
      run: |
        scp -i ~/.ssh/id_rsa docker-compose.prod.yml ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/gaming-platform/
        scp -i ~/.ssh/id_rsa .env.example ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/gaming-platform/

    - name: Deploy to production
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd ~/gaming-platform

          # Pull latest images
          docker-compose -f docker-compose.prod.yml pull

          # Run database migrations
          docker-compose -f docker-compose.prod.yml run --rm backend alembic upgrade head

          # Rolling update with zero downtime
          docker-compose -f docker-compose.prod.yml up -d --no-deps --build --scale backend=4 backend
          sleep 30
          docker-compose -f docker-compose.prod.yml up -d --no-deps --scale backend=2 backend

          # Update other services
          docker-compose -f docker-compose.prod.yml up -d

          # Clean up old images
          docker image prune -af

          # Health check
          sleep 15
          for i in {1..5}; do
            if curl -f http://localhost/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "Retry $i/5..."
            sleep 5
          done

          echo "❌ Health check failed"
          exit 1
        EOF

    - name: Run post-deployment tests
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd ~/gaming-platform

          # Test API endpoints
          curl -f https://yourdomain.com/api/v1/games/catalog || exit 1

          # Check all services are running
          docker-compose -f docker-compose.prod.yml ps | grep "Up" || exit 1

          echo "✅ Post-deployment tests passed"
        EOF

    - name: Rollback on failure
      if: failure()
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd ~/gaming-platform

          echo "🔄 Rolling back deployment..."

          # Restore previous version
          docker-compose -f docker-compose.prod.yml down

          # Restore database from backup (if needed)
          # LATEST_BACKUP=$(ls -t ./backups/backup_*.sql.gz | head -1)
          # gunzip < $LATEST_BACKUP | docker-compose exec -T postgres psql -U $POSTGRES_USER $POSTGRES_DB

          docker-compose -f docker-compose.prod.yml up -d

          echo "✅ Rollback completed"
        EOF

    - name: Create GitHub Release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.build-and-push.outputs.version }}
        release_name: Release ${{ needs.build-and-push.outputs.version }}
        body: |
          ## 🚀 Production Deployment

          Version: ${{ needs.build-and-push.outputs.version }}
          Deployed: ${{ github.event.head_commit.timestamp }}

          ### Changes
          ${{ github.event.head_commit.message }}

          ### Deployment Details
          - Environment: Production
          - Image: ${{ needs.build-and-push.outputs.image-tag }}
          - Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        draft: false
        prerelease: false

    - name: Notify deployment success
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '🎉 Production deployment successful!\n\nVersion: ${{ needs.build-and-push.outputs.version }}\nEnvironment: Production\nURL: https://yourdomain.com'
          });

    - name: Notify deployment failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '❌ Production deployment failed!\n\nVersion: ${{ needs.build-and-push.outputs.version }}\nPlease check the workflow logs for details.'
          });

  monitoring-alerts:
    name: Setup Monitoring Alerts
    runs-on: ubuntu-latest
    needs: deploy-production

    steps:
    - name: Trigger monitoring checks
      run: |
        echo "Setting up post-deployment monitoring..."
        # Add monitoring setup commands here
        # E.g., enable enhanced monitoring, set up alerts, etc.
